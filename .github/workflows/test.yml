name: Tests

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHON: .
          DATABASE_URL: sqlite:///./stockguard.db
          JWT_SECRET: stockguard-ci-secret
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          BOOTSTRAP_USER: admin
          BOOTSTRAP_PASSWORD: StockGuard@CI
        run: pytest -v
